[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hashcredit-gpu"
version = "0.1.0"
description = "Rackline GPU lending - shared domain types, PostgreSQL schema and migrations (GPU-015)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Rackline Team"}]

dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
hashcredit-gpu-db = "hashcredit_gpu.db.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hashcredit_gpu*"]

[tool.setuptools.package-data]
hashcredit_gpu = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
