# Shared GPU image: GPU_SERVICE selects api, indexer, proof, or monitor.
# Deployment/profile bindings are explicit; the API never receives a signing key.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "python -m hashcredit_api.gpu.server --initialize"
startCommand = "python -m hashcredit_api.gpu.server"
healthcheckPath = "/health"
# A worker that exits (finalized reorg, conservation break, unexpected exception) must come back and keep
# alerting rather than sit CRASHED: the indexer stayed down 2026-09-15 → 09-17 on a transient chain-change error.
restartPolicyType = "ALWAYS"
