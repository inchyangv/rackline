name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Invariant tests
        run: |
          FOUNDRY_INVARIANT_RUNS=50 FOUNDRY_INVARIANT_DEPTH=50 \
          forge test --match-path "test/invariant/*.sol" -vvv

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact reviewed findings and source hashes
        run: node script/gpu/check-slither-triage.mjs

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: slither.config.json
          fail-on: high
        id: slither

      - name: Upload Slither Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: results.sarif
          retention-days: 30

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HASHCREDIT_GPU_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install shared GPU package (hashcredit_gpu)
        run: |
          cd offchain/gpu
          pip install -e ".[dev]"

      - name: Install PostgreSQL client tools (pg_dump/pg_restore for migration tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies (relayer)
        run: |
          cd offchain/relayer
          pip install -e ".[dev]"

      - name: Install dependencies (prover)
        run: |
          cd offchain/prover
          pip install -e ".[dev]"

      - name: Install dependencies (api)
        run: |
          cd offchain/api
          pip install -e ".[dev]"

      - name: Run GPU package tests (PostgreSQL)
        run: |
          python -m pytest offchain/gpu/tests -v

      - name: Replay read-only legacy inventory
        run: python -m pytest script/gpu/test_inventory_legacy.py -q

      - name: Run relayer tests
        run: |
          cd offchain/relayer
          python -m pytest tests/ -v

      - name: Run prover tests
        run: |
          cd offchain/prover
          python -m pytest tests/ -v

      - name: Run API tests
        run: |
          cd offchain/api
          python -m pytest tests/ -v

  web:
    name: Web lint, build, unit and browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GPU API for generated schema parity
        run: pip install -e ./offchain/gpu -e ./offchain/api
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run build
      - run: npm --prefix apps/web run check:generated
        env:
          GPU_TYPES_PYTHON: python
      - run: npm --prefix apps/web run test:unit
      - name: Install browser and required system libraries
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failure-evidence
          path: apps/web/node_modules/.cache/playwright/test-results/
          retention-days: 7

  attestcoin-local:
    name: Official Attestcoin artifacts and LOCAL conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: offchain/attestcoin/package-lock.json
      - run: npm ci --prefix offchain/attestcoin
      - run: npm --prefix offchain/attestcoin run check
      - run: npm --prefix offchain/attestcoin run gen-wire -- --check
      - run: npm --prefix offchain/attestcoin run test -- --run
      - run: node --test script/gpu/consume-native.test.mjs
      # Local conformance is separate from the curated public native-testnet evidence.
