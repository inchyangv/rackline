version: "3.9"

# Railway monorepo helper:
# - Railway can import multiple services from a Compose file (drag-and-drop on the canvas).
# - This file is intentionally "no-secrets". Set real values in Railway Variables/Secrets.
#
# Services (Rackline; Python package/CLI names keep the legacy `hashcredit_*` identifiers)
# - rackline-api: public HTTP API (binds to $PORT). Run with API_PROFILE=production (no admin key).
# - rackline-prover-legacy: v1 Bitcoin SPV worker. Not part of the v2 (GPU) deployment; keep only
#   while legacy v1 borrowers/LPs need payout submission. Remove the service otherwise.
services:
  rackline-api:
    build:
      # Repo root context: the API installs the local `hashcredit-gpu` package from offchain/gpu (GPU-015).
      context: .
      dockerfile: Dockerfile
    environment:
      # For local `docker compose up` convenience. Railway overrides PORT.
      PORT: "8000"
      HOST: "0.0.0.0"
    ports:
      - "8000:8000"

  rackline-prover-legacy:
    build:
      # Repo root context (root Dockerfile.prover installs the local `hashcredit-gpu` package first).
      context: .
      dockerfile: Dockerfile.prover
