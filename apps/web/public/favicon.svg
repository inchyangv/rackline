<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Rackline</title>
  <!--
    Rackline mark. Geometry = src/components/shared/logo.tsx (24x24 viewBox) at scale 2,
    offset +10 so every edge lands on a multiple of 4 (pixel-exact at 16/32/48/64/512)
    and the glyph sits on its optical centre rather than its bounding-box centre.
    Bottom rule is the static fallback gauge, 8/16.
    Colours are the sRGB values of the oklch tokens in src/index.css.
  -->
  <!-- ink-0: oklch(0.205 0.004 250) -->
  <rect width="64" height="64" rx="14" fill="#161719"/>
  <!-- spine + outer rules: bone, oklch(0.93 0.005 90) -->
  <rect x="16" y="16" width="4" height="36" fill="#e9e8e4"/>
  <rect x="20" y="20" width="32" height="4" fill="#e9e8e4"/>
  <!-- centre rule: signal, oklch(0.7 0.19 45) -->
  <rect x="20" y="32" width="32" height="4" fill="#fa6e1d"/>
  <rect x="20" y="44" width="16" height="4" fill="#e9e8e4"/>
</svg>
