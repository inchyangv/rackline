[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
remappings = ["@gluwa/asc-contracts/contracts/=contracts/gpu/vendor/attestcoin/"]

# 0.8.28: required by the vendored official Attestcoin files (^0.8.28); legacy contracts (^0.8.24) compile unchanged.
# london: no PUSH0/transient storage; matches the Creditcoin EVM assumption made by the v1 deployment.
solc = "0.8.28"
evm_version = "london"
optimizer = true
optimizer_runs = 200
# Read-only access to fixtures for vm.readFile (enum parity, ABI fixtures). No write permissions.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fmt]
# Vendored official Attestcoin files are byte-pinned (contracts/gpu/vendor/attestcoin/VENDORED.md).
# These four files also preserve the source metadata of the confirmed Sepolia release.
ignore = ["contracts/gpu/vendor/**", "contracts/gpu/mocks/GpuTestToken.sol", "contracts/gpu/source/ISourceEscrow.sol", "contracts/gpu/source/SourceEscrow.sol", "script/gpu/DeployGpuSource.s.sol"]
bracket_spacing = true
int_types = "long"
line_length = 120
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
