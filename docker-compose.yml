version: "3.9"

# Local/dev compose for Rackline (v1 SPV services; the v2 GPU services are added by GPU-053).
#
# What you get:
# - db: Postgres (persistent volume)
# - rackline-api: FastAPI service (public HTTP); Python package name stays `hashcredit_api`
# - rackline-prover-legacy: v1 Bitcoin SPV worker (legacy; no public networking)
#
# Notes:
# - This file contains NO secrets. Put them in env files (ignored by git) or export in your shell.
# - For Railway production, prefer Railway Postgres plugin instead of running db as a service.

services:
  db:
    image: postgres:16-alpine
    container_name: rackline-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rackline}
      POSTGRES_USER: ${POSTGRES_USER:-rackline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rackline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rackline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  rackline-api:
    build:
      # Repo root context: the API installs the local `hashcredit-gpu` package from offchain/gpu (GPU-015).
      context: .
      dockerfile: Dockerfile
    container_name: rackline-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Safe defaults committed to git (no secrets). Override by exporting env vars or editing locally.
      - ./offchain/api/.env.compose
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      # Keep this aligned with prover. The API currently does not require DB,
      # but it's convenient to have it available for future extensions.
      DATABASE_URL: ${DATABASE_URL:-postgresql://rackline:rackline@db:5432/rackline}
    ports:
      - "${API_PORT:-8000}:8000"

  rackline-prover-legacy:
    build:
      # Repo root context (root Dockerfile.prover installs the local `hashcredit-gpu` package first).
      context: .
      dockerfile: Dockerfile.prover
    container_name: rackline-prover-legacy
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Safe defaults committed to git (no secrets). Override by exporting env vars or editing locally.
      - ./offchain/prover/.env.compose
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://rackline:rackline@db:5432/rackline}
    restart: unless-stopped

volumes:
  rackline_pgdata:
